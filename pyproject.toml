[build-system]
requires = ["setuptools>=61", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dLuxToliman"
description = "A repo to hold the canonical dLux Toliman models."
readme = "README.md"
dynamic = ["version", "urls", "classifiers", "authors", "requires-python"]
dependencies = [
    "dLux==0.15.*",
    "zodiax==0.5.*",
    "jax",
    "equinox",
    "dluxtras @ git+https://github.com/milolangker/dluxtras.git",  # spectra for toliman_sim
]

[project.optional-dependencies]
tests = [
    "pytest",
    "pytest-cov",
]
fits = ["astropy"]                                  # FITS output from toliman_sim
scripts = ["astropy", "openpyxl"]                   # scripts/ (spectra and throughput tables)
notebooks = ["jupyterlab", "ipykernel", "matplotlib"]  # notebooks/

# The version is defined once, as __version__ in dLuxToliman/__init__.py
[tool.setuptools.dynamic]
version = {attr = "dLuxToliman.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[scripts]